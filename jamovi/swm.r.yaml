---
name: swm
title: Spatial Weights
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: summary
      title: Spatial weights
      type: Table
      clearWith:
          - idVar
          - xVar
          - yVar
          - wSource
          - wFile
          - wIdField
          - wMethod
          - wK
          - wDist
          - wPower
          - wCutoff
          - wOrder
          - wCumul
          - wSymm
          - wLonLat
          - wStyle
      columns:
          - name: item
            title: ''
            type: text
          - name: value
            title: ''
            type: text

    - name: nbTable
      title: Distribution of the number of neighbours
      type: Table
      clearWith:
          - idVar
          - xVar
          - yVar
          - wSource
          - wFile
          - wIdField
          - wMethod
          - wK
          - wDist
          - wPower
          - wCutoff
          - wOrder
          - wCumul
          - wSymm
          - wLonLat
          - wStyle
      columns:
          - name: k
            title: Neighbours
            type: integer
          - name: n
            title: Units
            type: integer
          - name: pct
            title: '%'
            type: number

    - name: linkMap
      title: Connectivity map
      type: Image
      width: 560
      height: 480
      renderFun: .plotLinks
      visible: (linkPlot)
      clearWith:
          - idVar
          - xVar
          - yVar
          - wSource
          - wFile
          - wIdField
          - wMethod
          - wK
          - wDist
          - wPower
          - wCutoff
          - wOrder
          - wCumul
          - wSymm
          - wLonLat
          - wStyle

    - name: nbHist
      title: Number of neighbours
      type: Image
      width: 480
      height: 360
      renderFun: .plotHist
      visible: (histPlot)
      clearWith:
          - idVar
          - xVar
          - yVar
          - wSource
          - wFile
          - wIdField
          - wMethod
          - wK
          - wDist
          - wPower
          - wCutoff
          - wOrder
          - wCumul
          - wSymm
          - wLonLat
          - wStyle
