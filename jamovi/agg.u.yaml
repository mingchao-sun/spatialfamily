name: agg
title: Industrial Agglomeration
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Region
            children:
                - type: VariablesListBox
                  name: region
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Industry
            children:
                - type: VariablesListBox
                  name: industry
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Employment (or output)
            children:
                - type: VariablesListBox
                  name: value
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Number of establishments (optional)
            children:
                - type: VariablesListBox
                  name: firms
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Results
      collapsed: false
      children:
          - type: CheckBox
            name: showRegion
          - type: ComboBox
            name: sortBy
    - type: CollapseBox
      label: Save to the dataset
      collapsed: true
      children:
          - type: Output
            name: saveLQ

    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showGuide
          - type: CheckBox
            name: showHelp
