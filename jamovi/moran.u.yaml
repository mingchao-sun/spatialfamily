name: moran
title: Global Spatial Autocorrelation
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Variables
            children:
                - type: VariablesListBox
                  name: vars
                  isTarget: true
          - type: TargetLayoutBox
            label: Unit id (needed for files, optional for coordinates)
            children:
                - type: VariablesListBox
                  name: idVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: X / longitude (coordinates)
            children:
                - type: VariablesListBox
                  name: xVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Y / latitude (coordinates)
            children:
                - type: VariablesListBox
                  name: yVar
                  isTarget: true
                  height: small
                  maxItemCount: 1

    - type: CollapseBox
      label: Spatial weights
      collapsed: false
      children:
          - type: ComboBox
            name: wSource
          - type: TextBox
            name: wFile
            label: File path
            format: string
            stretchFactor: 1
            enable: (wSource:boundary || wSource:adjacency)
          - type: Label
            label: 'Tip: Shift + right-click the file in File Explorer,'
            enable: (wSource:boundary || wSource:adjacency)
          - type: Label
            label: 'choose Copy as path, then paste it here (or sample:nc.shp).'
            enable: (wSource:boundary || wSource:adjacency)
          - type: TextBox
            name: wIdField
            label: Id field in the boundary file
            format: string
            stretchFactor: 1
            enable: (wSource:boundary)
          - type: ComboBox
            name: wMethod
          - type: TextBox
            name: wK
            label: Number of neighbours (k)
            format: number
          - type: TextBox
            name: wDist
            label: Distance threshold (0 = automatic)
            format: number
          - type: TextBox
            name: wPower
            label: Distance decay exponent
            format: number
          - type: TextBox
            name: wCutoff
            label: Distance cutoff (0 = none)
            format: number
          - type: TextBox
            name: wOrder
            label: Order of neighbours
            format: number
          - type: CheckBox
            name: wCumul
          - type: CheckBox
            name: wSymm
          - type: CheckBox
            name: wLonLat
          - type: ComboBox
            name: wStyle
    - type: CollapseBox
      label: Statistics
      collapsed: false
      children:
          - type: CheckBox
            name: geary
          - type: CheckBox
            name: getisG
          - type: CheckBox
            name: scatter
    - type: CollapseBox
      label: Inference
      collapsed: false
      children:
          - type: ComboBox
            name: inference
          - type: ComboBox
            name: alt
          - type: TextBox
            name: nperm
            label: Number of permutations
            format: number
          - type: TextBox
            name: seed
            label: Random seed
            format: number

    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showGuide
          - type: CheckBox
            name: showHelp
