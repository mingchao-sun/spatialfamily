---
name: spdid
title: Spatial DID (Spillovers)
jas: '1.2'
version: '1.0.0'
menuGroup: Spatial
menuSubgroup: Causal
menuTitle: Spatial DID (Spillovers)
menuSubtitle: TWFE with distance rings and spillover to neighbours

options:
    - name: data
      type: Data

    - name: dep
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: Treatment (1 when the unit is treated in the period)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates (optional)
      type: Variables
      suggested:
          - continuous
      permitted:
          - numeric

    - name: timeVar
      title: Time period
      type: Variable
      permitted:
          - numeric
          - factor
          - id

    - name: idVar
      title: Unit id
      type: Variable
      permitted:
          - numeric
          - factor
          - id

    - name: xVar
      title: X / longitude
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: yVar
      title: Y / latitude
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: wSource
      title: Spatial weights from
      type: List
      options:
          - name: coords
            title: Coordinates (x, y columns)
          - name: boundary
            title: Boundary file (shapefile or GeoJSON)
          - name: adjacency
            title: Neighbour list file (edge list, GAL, GWT)
      default: coords

    - name: wFile
      title: File path
      type: String
      default: ''

    - name: wIdField
      title: Id field in the boundary file
      type: String
      default: ''

    - name: wMethod
      title: Neighbours defined by
      type: List
      options:
          - name: auto
            title: Default for the source (k nearest / queen)
          - name: knn
            title: k nearest neighbours
          - name: dist
            title: Distance band
          - name: idw
            title: Inverse distance
          - name: queen
            title: Queen contiguity (boundary file)
          - name: rook
            title: Rook contiguity (boundary file)
      default: auto

    - name: wK
      title: Number of neighbours (k)
      type: Integer
      default: 5
      min: 1
      max: 500

    - name: wDist
      title: Distance threshold (0 = automatic)
      type: Number
      default: 0
      min: 0

    - name: wPower
      title: Distance decay exponent
      type: Number
      default: 1
      min: 0

    - name: wCutoff
      title: Distance cutoff for inverse distance (0 = none)
      type: Number
      default: 0
      min: 0

    - name: wOrder
      title: Order of neighbours
      type: Integer
      default: 1
      min: 1
      max: 10

    - name: wCumul
      title: Include lower orders
      type: Bool
      default: false

    - name: wSymm
      title: Make links symmetric
      type: Bool
      default: false

    - name: wLonLat
      title: Coordinates are longitude / latitude (distances in km)
      type: Bool
      default: false

    - name: wStyle
      title: Weights style
      type: List
      options:
          - name: W
            title: Row-standardised
          - name: B
            title: As built (binary or distance)
          - name: C
            title: Globally standardised
      default: W

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: rings
      title: Distance rings (upper limits, e.g. 5, 10, 20)
      type: String
      default: ''

    - name: lagTreat
      title: Add the spatially lagged treatment (W x treatment)
      type: Bool
      default: false

    - name: effects
      title: Fixed effects
      type: List
      options:
          - name: twoway
            title: Unit and time
          - name: unit
            title: Unit only
          - name: time
            title: Time only
      default: twoway

    - name: se
      title: Standard errors
      type: List
      options:
          - name: cluster
            title: Clustered by unit
          - name: robust
            title: Heteroskedasticity-robust
          - name: conley
            title: Conley spatial HAC
      default: cluster

    - name: conleyBw
      title: Conley distance bandwidth
      type: Number
      default: 0
      min: 0

    - name: conleyLag
      title: Conley serial correlation lag (periods)
      type: Integer
      default: 0
      min: 0
      max: 20

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9
