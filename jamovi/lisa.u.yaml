name: lisa
title: Local Spatial Autocorrelation
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Variable
            children:
                - type: VariablesListBox
                  name: var
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Unit id (needed for files, optional for coordinates)
            children:
                - type: VariablesListBox
                  name: idVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: X / longitude (coordinates)
            children:
                - type: VariablesListBox
                  name: xVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Y / latitude (coordinates)
            children:
                - type: VariablesListBox
                  name: yVar
                  isTarget: true
                  height: small
                  maxItemCount: 1

    - type: CollapseBox
      label: Spatial weights
      collapsed: false
      children:
          - type: ComboBox
            name: wSource
          - type: TextBox
            name: wFile
            label: File path
            format: string
            stretchFactor: 1
            enable: (wSource:boundary || wSource:adjacency)
          - type: Label
            label: 'Tip: Shift + right-click the file in File Explorer,'
            enable: (wSource:boundary || wSource:adjacency)
          - type: Label
            label: 'choose Copy as path, then paste it here (or sample:nc.shp).'
            enable: (wSource:boundary || wSource:adjacency)
          - type: TextBox
            name: wIdField
            label: Id field in the boundary file
            format: string
            stretchFactor: 1
            enable: (wSource:boundary)
          - type: ComboBox
            name: wMethod
          - type: TextBox
            name: wK
            label: Number of neighbours (k)
            format: number
          - type: TextBox
            name: wDist
            label: Distance threshold (0 = automatic)
            format: number
          - type: TextBox
            name: wPower
            label: Distance decay exponent
            format: number
          - type: TextBox
            name: wCutoff
            label: Distance cutoff (0 = none)
            format: number
          - type: TextBox
            name: wOrder
            label: Order of neighbours
            format: number
          - type: CheckBox
            name: wCumul
          - type: CheckBox
            name: wSymm
          - type: CheckBox
            name: wLonLat
          - type: ComboBox
            name: wStyle
    - type: CollapseBox
      label: Statistic and inference
      collapsed: false
      children:
          - type: ComboBox
            name: stat
          - type: TextBox
            name: nperm
            label: Number of permutations
            format: number
          - type: TextBox
            name: seed
            label: Random seed
            format: number
          - type: TextBox
            name: alpha
            label: Significance level
            format: number
          - type: ComboBox
            name: adjust
    - type: CollapseBox
      label: Results
      collapsed: false
      children:
          - type: CheckBox
            name: map
          - type: CheckBox
            name: scatter
          - type: CheckBox
            name: showUnits
    - type: CollapseBox
      label: Save to the dataset
      collapsed: true
      children:
          - type: Output
            name: saveCluster
          - type: Output
            name: saveStat
          - type: Output
            name: saveP

    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showGuide
          - type: CheckBox
            name: showHelp
