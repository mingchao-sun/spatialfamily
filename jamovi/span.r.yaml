          - wSource
          - wFile
          - wIdField
          - wMethod
          - wK
          - wDist
          - wPower
          - wCutoff
          - wOrder
          - wCumul
          - wSymm
          - wLonLat
          - wStyle
          - dep
          - covs
          - noLag
          - timeVar
          - model
          - panelEffects
          - level
      columns:
          - name: term
            title: ''
            type: text
          - name: est
            title: Estimate
            type: number
          - name: se
            title: Std. error
            type: number
          - name: z
            title: z / t
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: lo
            title: Lower
            type: number
          - name: hi
            title: Upper
            type: number

    - name: fit
      title: Model fit
      type: Table
      clearWith:
          - idVar
