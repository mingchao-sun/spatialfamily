name: spdid
title: Spatial DID (Spillovers)
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: dep
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment (1 when the unit is treated in the period)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates (optional)
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Time period
            children:
                - type: VariablesListBox
                  name: timeVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Unit id
            children:
                - type: VariablesListBox
                  name: idVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: X / longitude (coordinates)
            children:
                - type: VariablesListBox
                  name: xVar
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Y / latitude (coordinates)
            children:
                - type: VariablesListBox
                  name: yVar
                  isTarget: true
                  height: small
                  maxItemCount: 1

    - type: CollapseBox
      label: Spatial weights
      collapsed: false
      children:
          - type: ComboBox
            name: wSource
          - type: TextBox
            name: wFile
            label: File path
            format: string
            stretchFactor: 1
            enable: (wSource:boundary || wSource:adjacency)
          - type: Label
            label: 'Tip: Shift + right-click the file in File Explorer,'
            enable: (wSource:boundary || wSource:adjacency)
          - type: Label
            label: 'choose Copy as path, then paste it here (or sample:nc.shp).'
            enable: (wSource:boundary || wSource:adjacency)
          - type: TextBox
            name: wIdField
            label: Id field in the boundary file
            format: string
            stretchFactor: 1
            enable: (wSource:boundary)
          - type: ComboBox
            name: wMethod
          - type: TextBox
            name: wK
            label: Number of neighbours (k)
            format: number
          - type: TextBox
            name: wDist
            label: Distance threshold (0 = automatic)
            format: number
          - type: TextBox
            name: wPower
            label: Distance decay exponent
            format: number
          - type: TextBox
            name: wCutoff
            label: Distance cutoff (0 = none)
            format: number
          - type: TextBox
            name: wOrder
            label: Order of neighbours
            format: number
          - type: CheckBox
            name: wCumul
          - type: CheckBox
            name: wSymm
          - type: CheckBox
            name: wLonLat
          - type: ComboBox
            name: wStyle
    - type: CollapseBox
      label: Spillovers
      collapsed: false
      children:
          - type: TextBox
            name: rings
            label: Distance rings (upper limits, e.g. 5, 10, 20)
            format: string
            stretchFactor: 1
          - type: CheckBox
            name: lagTreat
    - type: CollapseBox
      label: Estimation
      collapsed: false
      children:
          - type: ComboBox
            name: effects
          - type: ComboBox
            name: se
          - type: TextBox
            name: conleyBw
            label: Conley distance bandwidth
            format: number
            enable: (se:conley)
          - type: TextBox
            name: conleyLag
            label: Conley serial correlation lag
            format: number
            enable: (se:conley)
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number

    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showGuide
          - type: CheckBox
            name: showHelp
